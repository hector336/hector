<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body>
    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/SIGNOS/WIN_20260731_15_57_18_Pro.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>
        </div>
    </nav>

    <div class="container p-4 bg-info mt-5 card">
        <h1 class="text-center">SIGNOS ZODIACALES</h1> <hr>
        <div class="row">
            <div class="col">
                <h5 id="valorDia">DIA 1</h5>
                <input type="range" class="form-control" id="dia" min="1" max="30" value="1"> <br>
                <h5>MES</h5>
                <select class="form-control" id="mes">
                    <option value="ENERO">ENERO</option>
                    <option value="FEBRERO">FEBRERO</option>
                    <option value="MARZO">MARZO</option>
                    <option value="ABRIL">ABRIL</option>
                    <option value="MAYO">MAYO</option>
                    <option value="JUNIO">JUNIO</option>
                    <option value="JULIO">JULIO</option>
                    <option value="AGOSTO">AGOSTO</option>
                    <option value="SEPTIEMBRE">SEPTIEMBRE</option>
                    <option value="OCTUBRE">OCTUBRE</option>
                    <option value="NOVIEMBRE">NOVIEMBRE</option>
                    <option value="DICIEMBRE">DICIEMBRE</option>
                </select>

                <h2 id="fecha" class="text-center mt-5">FECHA</h2>
                <button class="btn-solid theme-warning mt-3 w-100" id="reset">RESET</button>
                
            </div>
            <div class="col">
                <img src="img/SIGNOS/WIN_20260731_15_57_18_Pro.jpg" id="signo" width="100%">
                
                

            </div>
        </div>
    </div>
    <div class="container p-4 bg-light mt-5 card">
    <h3 class="text-center">VIDEO EXPLICATIVO DE LA PRÁCTICA</h3>
    <hr>
    <div class="ratio ratio-16x9">

        <video controls>
            <source src="img/sinos.mp4">
            Tu navegador no soporta la reproducción de video.
        </video>
        
       
       
    </div>
</div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/pollito.js"></script>
</body>
</html>
