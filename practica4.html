<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salario Neto</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #212529;
        }
        .contenedor { max-width: 820px; margin: 0 auto; padding: 0 1rem 2rem; }

        h1.titulo {
            font-size: 5rem;
            font-weight: 300;
            line-height: 1.2;
            text-align: center;
            margin: 1rem 0 1.2rem;
        }

        /* Tablas sin bordes, solo líneas finas horizontales */
        table.tabla { width: 100%; border-collapse: collapse; text-align: center; }
        table.tabla th, table.tabla td {
            padding: .9rem .6rem;
            border-top: 1px solid #dee2e6;
            vertical-align: middle;
            background: transparent;
        }

        /* Encabezados de los selects (Puesto / Horas / Años) */
        table.seleccion th { font-weight: 400; font-size: 1rem; padding-bottom: .8rem; }
        table.seleccion td { padding-top: .8rem; }

        /* Selects redondeados de ancho completo */
        .selector {
            display: block;
            width: 100%;
            padding: .5rem .75rem;
            font-size: .95rem;
            color: #495057;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: .3rem;
        }
        .selector:focus {
            outline: 0;
            border-color: #80bdff;
            box-shadow: 0 0 0 .2rem rgba(0, 123, 255, .25);
        }

        /* Percepciones / Deducciones */
        table.resumen th {
            font-size: 2rem;
            font-weight: 500;
            text-transform: uppercase;
            padding: 1.2rem .6rem;
        }
        table.resumen td.concepto { font-size: .95rem; font-weight: 300; width: 25%; }
        table.resumen td.monto    { font-size: 1.6rem; font-weight: 500; width: 25%; }

        table.resumen tr.total td.concepto {
            font-size: 1.6rem; font-weight: 500; text-transform: uppercase; line-height: 1.2;
        }
        table.resumen tr.neto td.concepto {
            font-size: 1.6rem; font-weight: 500; text-transform: uppercase;
        }

        @media (max-width: 576px) {
            h1.titulo { font-size: 3rem; }
            table.resumen th { font-size: 1.3rem; }
            table.resumen td.monto { font-size: 1.2rem; }
            table.resumen tr.total td.concepto, table.resumen tr.neto td.concepto { font-size: 1.1rem; }
        }
    </style>
</head>
<body onload="calcularSalarioNeto()">

    <!-- Barra superior (opcional: bórrala si en el video no aparece) -->
    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="index.html">
                <img src="img/WIN_20260731_15_57_18_Pro.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>
        </div>
    </nav>

    <div class="contenedor">
        <h1 class="titulo">Salario Neto</h1>

        <table class="tabla seleccion">
            <thead>
                <tr>
                    <th>Puesto</th>
                    <th>Horas</th>
                    <th>Años</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <select id="puesto" class="selector" onchange="calcularSalarioNeto()">
                            <option value="1">Gerente</option>
                            <option value="2">Secretaria</option>
                            <option value="3">Cajero</option>
                        </select>
                    </td>
                    <td>
                        <select id="horas" class="selector" onchange="calcularSalarioNeto()"></select>
                    </td>
                    <td>
                        <select id="años" class="selector" onchange="calcularSalarioNeto()"></select>
                    </td>
                </tr>
            </tbody>
        </table>

        <table class="tabla resumen">
            <thead>
                <tr>
                    <th colspan="2">Percepciones</th>
                    <th colspan="2">Deducciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="concepto">Sueldo Base</td>
                    <td class="monto"><span id="sueldoBase">$0.00</span></td>
                    <td class="concepto">ISR</td>
                    <td class="monto"><span id="isr">$0.00</span></td>
                </tr>
                <tr>
                    <td class="concepto">Canasta Básica</td>
                    <td class="monto"><span id="canastaBásica">$0.00</span></td>
                    <td class="concepto">Servicio de Salud</td>
                    <td class="monto"><span id="servicioSalud">$0.00</span></td>
                </tr>
                <tr>
                    <td class="concepto">Apoyo</td>
                    <td class="monto"><span id="apoyo">$0.00</span></td>
                    <td class="concepto">AFORE</td>
                    <td class="monto"><span id="afore">$0.00</span></td>
                </tr>
                <tr>
                    <td class="concepto">Antigüedad</td>
                    <td class="monto"><span id="antigüedad">$0.00</span></td>
                    <td class="concepto">Sindicato</td>
                    <td class="monto"><span id="sindicato">$0.00</span></td>
                </tr>
                <tr>
                    <td class="concepto">Estímulo</td>
                    <td class="monto"><span id="estímulo">$0.00</span></td>
                    <td colspan="2"></td>
                </tr>
                <tr class="total">
                    <td class="concepto">Total Percepciones</td>
                    <td class="monto"><span id="totalPercepciones">$0.00</span></td>
                    <td class="concepto">Total Deducciones</td>
                    <td class="monto"><span id="totalDeducciones">$0.00</span></td>
                </tr>
                <tr class="neto">
                    <td class="concepto" colspan="2">Salario Neto</td>
                    <td class="monto" colspan="2"><span id="salarioNeto">$0.00</span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="js/appsalarioneto.js"></script>
</body>
</html>
