  function mensaje7(){
    Swal.fire({
      toast: true, position: 'top-end', icon: 'success',
      title: 'Modo nocturno activado', showConfirmButton: false,
      timer: 3000, timerProgressBar: true
    });
  }

  function mensaje8(){
    let timerInterval;
    Swal.fire({
      title: 'Enviando...',
      html: 'Cerrando en <b></b> milisegundos.',
      timer: 2000, timerProgressBar: true,
      didOpen: () => {
        Swal.showLoading();
        const b = Swal.getHtmlContainer().querySelector('b');
        timerInterval = setInterval(() => { b.textContent = Swal.getTimerLeft(); }, 100);
      },
      willClose: () => { clearInterval(timerInterval); }
    });
  }

  function mensaje9(){
    Swal.fire({
      title: 'Tu nombre:', input: 'text',
      showCancelButton: true, confirmButtonText: 'Guardar', cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire(`¡Hola, ${result.value}!`, '', 'success');
      }
    });
  }

  function mensaje10(){
    Swal.fire({
      title: '¿Apagar sistema?', text: "Se perderán los cambios.",
      icon: 'warning', showCancelButton: true,
      confirmButtonColor: '#d33', cancelButtonColor: '#3085d6',
      confirmButtonText: 'Sí, apagar', cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire('¡Apagado!', 'El sistema se detuvo.', 'success');
      }
    });
  }
